  <rect x="0" y="0" width="8" height="630" fill="#27ae60"/>

  <!-- Content area -->
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="#ffffff" opacity="0.95"/>

  <!-- Name -->
  <text x="120" y="180" font-family="Inter, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#1a4d2e">Virinderpal Singh Batth</text>

