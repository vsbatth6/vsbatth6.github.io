# Site settings
title: Virinderpal Singh Batth
description: Lead Data Engineer with 8+ years in financial services — Snowflake, dbt, AWS, Kafka, PySpark. 95% compute reductions, 2TB+ migrations, real-time pipelines.
author: Virinderpal Singh Batth

# Build settings
markdown: kramdown
theme: minima

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Permalink structure
permalink: pretty

# Enable GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
